# Server Configuration
server.port=8080

# Application Name
spring.application.name=netpulse

# Database Configuration (H2 in-memory by default for development, easily switchable to PostgreSQL)
spring.datasource.url=jdbc:h2:mem:netpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jev AI Configuration
jev.api.url=https://api.typesafe.ai/v1/systemone
jev.api.key=${JEV_API_KEY:apikey_2449698bc53f7af4d9b82d1c5bf54bcacb0_ffe1de3d81523d92b0569d799866262d6d37cc825dfd24426ddf429e44fc7f87}
jev.model=jev-latest
